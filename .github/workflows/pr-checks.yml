name: PR checks

# Secret-free JVM unit tests for every pull request (issue #44). No emulator, signing,
# release build or update publication runs here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out revision with the extractor submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # compileSdk 37 is published as "android-37.0" (API levels now carry a minor version).
      - name: Install Android platform 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME:?Android SDK root is required}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-37.0"

      - name: Run unit tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          --no-daemon --continue
          -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore
